name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --name LorentzOsciladores lorentz_gui.py

      - name: Subir el .exe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: LorentzOsciladores-windows
          path: dist/LorentzOsciladores.exe
